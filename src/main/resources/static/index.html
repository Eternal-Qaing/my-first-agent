<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Agent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header .status {
            font-size: 12px;
            opacity: 0.8;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f7f8fc;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #667eea;
            color: #fff;
        }

        .message.assistant .avatar {
            background: #764ba2;
            color: #fff;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .bubble {
            background: #667eea;
            color: #fff;
            border-top-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e5e7eb;
            border-top-left-radius: 4px;
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #764ba2;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-area {
            padding: 16px 20px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 0 24px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-hint {
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
            font-size: 14px;
        }

        .empty-hint .examples {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .empty-hint .examples span {
            background: #fff;
            border: 1px solid #e5e7eb;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .empty-hint .examples span:hover {
            border-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div>
            <h1>🤖 My First Agent</h1>
            <div class="status">Spring AI · 支持工具调用 · RAG 知识检索</div>
        </div>
        <button class="new-chat-btn" onclick="newChat()">新会话</button>
    </div>

    <div class="messages" id="messages">
        <div class="empty-hint">
            开始和 AI Agent 对话吧
            <div class="examples">
                <span onclick="quickAsk('杭州今天天气怎么样？')">杭州今天天气怎么样？</span>
                <span onclick="quickAsk('我的项目代号是什么？')">我的项目代号是什么？</span>
                <span onclick="quickAsk('你好，请介绍一下你自己')">你好，请介绍一下你自己</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input
                id="input"
                type="text"
                placeholder="输入消息，按 Enter 发送..."
                autocomplete="off"
                onkeydown="if(event.key === 'Enter' && !event.isComposing) send()"
        />
        <button id="sendBtn" onclick="send()">发送</button>
    </div>
</div>

<script>
    let conversationId = generateConversationId();
    let isStreaming = false;

    function generateConversationId() {
        return 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    function newChat() {
        if (isStreaming) return;
        conversationId = generateConversationId();
        document.getElementById('messages').innerHTML = `
                <div class="empty-hint">
                    已开始新会话
                    <div class="examples">
                        <span onclick="quickAsk('杭州今天天气怎么样？')">杭州今天天气怎么样？</span>
                        <span onclick="quickAsk('我的项目代号是什么？')">我的项目代号是什么？</span>
                    </div>
                </div>
            `;
    }

    function quickAsk(text) {
        document.getElementById('input').value = text;
        send();
    }

    function clearEmptyHint() {
        const hint = document.querySelector('.empty-hint');
        if (hint) hint.remove();
    }

    function addMessage(role, content) {
        clearEmptyHint();
        const messagesEl = document.getElementById('messages');
        const msgEl = document.createElement('div');
        msgEl.className = 'message ' + role;

        const avatarEl = document.createElement('div');
        avatarEl.className = 'avatar';
        avatarEl.textContent = role === 'user' ? '👤' : '🤖';

        const bubbleEl = document.createElement('div');
        bubbleEl.className = 'bubble';
        bubbleEl.textContent = content;

        msgEl.appendChild(avatarEl);
        msgEl.appendChild(bubbleEl);
        messagesEl.appendChild(msgEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        return bubbleEl;
    }

    function send() {
        if (isStreaming) return;

        const input = document.getElementById('input');
        const message = input.value.trim();
        if (!message) return;

        input.value = '';
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;

        addMessage('user', message);

        const bubble = addMessage('assistant', '');
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        bubble.appendChild(cursor);

        const url = '/chat/stream?message=' + encodeURIComponent(message)
            + '&conversationId=' + encodeURIComponent(conversationId);

        const es = new EventSource(url);

        es.onmessage = function(event) {
            // 移除光标，追加新内容，再加回光标
            if (cursor.parentNode === bubble) {
                bubble.removeChild(cursor);
            }
            bubble.textContent += event.data;
            bubble.appendChild(cursor);
            document.getElementById('messages').scrollTop =
                document.getElementById('messages').scrollHeight;
        };

        es.onerror = function() {
            if (cursor.parentNode === bubble) {
                bubble.removeChild(cursor);
            }
            es.close();
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('input').focus();
        };
    }

    document.getElementById('input').focus();
</script>
</body>
</html>
