server:
  port: 10020

# 你的高德 API Key 配置
amap:
  api-key: ${AMAP_API_KEY}
spring:
  application:
    name: first-agent
  datasource:
    url: jdbc:postgresql://${PGSQL}:5432/agent_rag
    username: postgres
    password: ${PGSQL_PWD}
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${SILICONFLOW_API_KEY}
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
      embedding:
        options:
          model: BAAI/bge-m3
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
#    openai:
#      #kimi_api
#      base-url: https://api.moonshot.cn/v1
#      api-key: ${KIMI_API_KEY}
#      chat:
#        options:
#          model: kimi-k2.6
      #aliyun-api
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#      api-key: ${DEEPSEEK_API_KEY}
      #deepseek_api
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#      api-key: ${DEEPSEEK_API_KEY}

  data:
    redis:
      host: ${PGSQL}
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
agent:
  system-prompt: |
    你的职责：
    你是一个严谨、可靠的智能助手，名字叫"小助"。

    你的工作方式：
    1. 当用户询问天气相关问题时，**必须调用 getWeather 工具**获取真实数据，绝对不能编造。
    2. 当用户询问其他问题时，可以基于提供的参考资料回答；如果参考资料没有相关内容，就诚实地说不知道。
    3. 回答要简洁、专业。

    当前时间：请忽略系统时间相关的提问，你没有获取实时时间的能力。
logging:
  level:
    root: INFO
    #开发时开 DEBUG，生产改回 INFO
    com.qiang.myfirstagent: DEBUG
  pattern:
    # 控制台输出格式：时间 | 级别 | 线程 | 类名 | 消息
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
