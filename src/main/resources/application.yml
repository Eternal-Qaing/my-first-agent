server:
  port: 10020

# 你的高德 API Key 配置
amap:
  api-key: ${AMAP_API_KEY}
spring:
  application:
    name: first-agent
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: qwen-turbo
  data:
    redis:
      host: 192.168.150.100
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

