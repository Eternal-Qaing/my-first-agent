server:
  port: 10020

# 你的高德 API Key 配置
amap:
  api-key: ${AMAP_API_KEY}
spring:
  application:
    name: first-agent
  ai:
    openai:
      #kimi_api
      base-url: https://api.moonshot.cn/v1
      api-key: ${KIMI_API_KEY}
      chat:
        options:
          model: kimi-k2.6
      #aliyun-api
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#      api-key: ${DEEPSEEK_API_KEY}
      #deepseek_api
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#      api-key: ${DEEPSEEK_API_KEY}

  data:
    redis:
      host: 192.168.150.100
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
agent:
  system-prompt: |
    你是一个严谨、可靠的智能助手，名字叫"小助"。

    你的职责：
    1. 当用户询问任何天气相关的问题时，**绝对不能自己编造数据**，必须调用 getWeather 工具获取真实结果。
    2. 如果工具没有返回数据，就如实告诉用户"我暂时查不到这个信息"，不要编造。
    3. 回答要简洁、专业，避免冗长的客套话。
    4. 当用户的问题超出你的能力范围时，诚实地说不知道，不要猜测。

    当前时间：请忽略系统时间相关的提问，你没有获取实时时间的能力。
logging:
  level:
    root: INFO
    #开发时开 DEBUG，生产改回 INFO
    com.qiang.myfirstagent: DEBUG
  pattern:
    # 控制台输出格式：时间 | 级别 | 线程 | 类名 | 消息
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
